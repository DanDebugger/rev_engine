[package]
name = "rev_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
 actix-cors = "0.7.1"
    actix-web = "4.11.0"
    anyhow = "1.0.99"
    axum = { version = "0.8.4", features = ["multipart"] }
    axum-extra = { version = "0.10.1", features = ["cookie"] }
    base64 = "0.22.1"
    chrono = { version = "0.4.41", features = ["serde"] }
    dashmap = "6.1.0"
    dotenvy = "0.15.7"
    futures-util = "0.3.31"
    image = "0.25.8"
    infer = "0.19.0"
    jsonwebtoken = "9.3.1"
    moka = { version = "0.12.10", features = ["future"] }
    multer = "3.1.0"
    once_cell = "1.21.3"
    reqwest = { version = "0.12.22", features = ["json", "multipart", "stream", "cookies", "gzip", "brotli", "deflate", "rustls-tls", "blocking", "socks"] }
    serde = { version = "1.0.219", features = ["derive"] }
    serde_json = "1.0.140"
    sha2 = "0.10.9"
    sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-native-tls"] }
    time = "0.3.41"
    tokio = { version = "1.46.1", features = ["full"] }
    tokio-rustls = "0.26.2"
    tower = "0.5.2"
    tower-http = { version = "0.6.6", features = ["cors", "set-header", "trace"] }
    tracing = "0.1.41"
    tracing-subscriber = "0.3.19"
    urlencoding = "2.1.3"
    uuid = { version = "1.17.0", features = ["serde", "v4"] }
    webp = "0.3.1"
    argon2 = "0.5"
    rand_core = { version = "0.6", features = ["std"] }
pgvector = { version = "0.4.1", features = ["sqlx"] }
scraper = "0.25.0"
text-splitter = "0.29.3"
lopdf = "0.39.0"
async-trait = "0.1.89"
thiserror = "2.0.18"

    [[bin]]
    name = "rev_engine"
    path = "src/rev_engine.rs"

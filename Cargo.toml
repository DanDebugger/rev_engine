[package]
name = "rev_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
    anyhow = "1.0.99"
    axum = { version = "0.8.4", features = ["multipart"] }
    base64 = "0.22.1"
    chrono = { version = "0.4.41", features = ["serde"] }
    dashmap = "6.1.0"
    dotenvy = "0.15.7"
    jsonwebtoken = "9.3.1"
    reqwest = { version = "0.12.22", features = ["json", "multipart", "stream", "cookies", "gzip", "brotli", "deflate", "rustls-tls", "blocking", "socks"] }
    serde = { version = "1.0.219", features = ["derive"] }
    serde_json = "1.0.140"
    sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-native-tls"] }
    tokio = { version = "1.46.1", features = ["full"] }
    tower-http = { version = "0.6.6", features = ["cors", "set-header", "trace"] }
    http-body-util = "0.1.2"
    tracing = "0.1.41"
    tracing-subscriber = "0.3.19"
    uuid = { version = "1.17.0", features = ["serde", "v4"] }
    argon2 = "0.5"
    rand_core = { version = "0.6", features = ["std"] }
pgvector = { version = "0.4.1", features = ["sqlx"] }
scraper = "0.25.0"
text-splitter = "0.29.3"
lopdf = "0.39.0"
async-trait = "0.1.89"
thiserror = "2.0.18"
    aes-gcm = "0.10.3"
    hmac = "0.12.1"
    sha2 = "0.10.8"
    rand = "0.8"

    [[bin]]
    name = "rev_engine"
    path = "src/rev_engine.rs"
